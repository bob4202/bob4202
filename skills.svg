<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="My skills: Go, Python, TypeScript, JavaScript, SQL, Lua, Node.js, REST APIs, OAuth 2.0, PostgreSQL, MySQL, Testing, Google Cloud, Docker, Git, Neovim, React, Next.js.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .label { fill: #8b949e; font-size: 12px; }
    .cat   { font-size: 13px; font-weight: 700; }
    .skill { fill: #e6edf3; font-size: 12px; }
    .tile  { animation: lift 18s ease-in-out infinite; }
    .glow  { fill: var(--c); stroke: var(--c); stroke-width: 1.5; fill-opacity: 0; stroke-opacity: 0; animation: glow 18s ease-in-out infinite; }

    @keyframes lift {
      0%      { transform: translateY(0); }
      1.5%    { transform: translateY(-4px); }
      5.5%    { transform: translateY(-4px); }
      7.5%, 100% { transform: translateY(0); }
    }
    @keyframes glow {
      0%      { fill-opacity: 0;    stroke-opacity: 0; }
      1.5%    { fill-opacity: .20;  stroke-opacity: 1; }
      5.5%    { fill-opacity: .20;  stroke-opacity: 1; }
      7.5%, 100% { fill-opacity: 0; stroke-opacity: 0; }
    }
  </style>

  <rect x="1" y="1" width="898" height="268" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <text x="30" y="32" class="label">~/skills</text>

  <g style="--c:#58a6ff">
