<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Thet Naung Soe, software developer in London. TypeScript, Python, Go, PostgreSQL.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>

    <!-- name gradient that slowly shifts colour -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#58a6ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#58a6ff;#bc8cff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#58a6ff" stroke-opacity="0.06"/>
    </pattern>

    <clipPath id="win"><rect x="1" y="1" width="898" height="318" rx="14"/></clipPath>

    <!-- typing reveals: each clip rect grows one character at a time, then the loop restarts -->
    <clipPath id="ct1">
      <rect x="40" y="76" height="28" width="90">
        <animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="discrete"
          values="0;11.3;22.5;33.8;45;56.3;67.5;78.8;90;90"
          keyTimes="0;0.025;0.0325;0.04;0.0475;0.055;0.0625;0.07;0.0775;1"/>
      </rect>
    </clipPath>
    <clipPath id="ct2">
      <rect x="40" y="112" height="54" width="360">
        <animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="discrete"
          values="0;25.7;51.4;77.1;102.8;128.5;154.2;179.9;205.6;231.3;257;282.7;308.4;334.1;360;360"
          keyTimes="0;0.1;0.1075;0.115;0.1225;0.13;0.1375;0.145;0.1525;0.16;0.1675;0.175;0.1825;0.19;0.1975;1"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .title  { fill: #8b949e; font-size: 13px; }
    .prompt { fill: #3fb950; font-size: 16px; }
    .cmd    { fill: #e6edf3; font-size: 16px; }
    .name   { fill: url(#accent); font-size: 42px; font-weight: 700; }
    .role   { fill: #e6edf3; font-size: 22px; }
    .tags   { fill: #79c0ff; font-size: 16px; }
    .cursor { fill: #3fb950; animation: blink 1.1s steps(1) infinite; }
    .g      { fill: #58a6ff; font-size: 18px; opacity: .15; animation: float 12s linear infinite; }

    /* three lines take turns in the same spot, on the same 16s loop as the typing */
    .r1 { animation: r1 16s ease-out infinite; }
    .r2 { animation: r2 16s ease-out infinite; }
    .r3 { animation: r3 16s ease-out infinite; }

    @keyframes r1 { 0%,21%  { opacity: 0; transform: translateY(8px); } 23%,41% { opacity: 1; transform: translateY(0); } 43%,100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes r2 { 0%,42%  { opacity: 0; transform: translateY(8px); } 44%,62% { opacity: 1; transform: translateY(0); } 64%,100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes r3 { 0%,63%  { opacity: 0; transform: translateY(8px); } 65%,83% { opacity: 1; transform: translateY(0); } 85%,100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes float { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .35; } 85% { opacity: .35; } 100% { transform: translateY(-300px); opacity: 0; } }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="898" height="318" rx="14" fill="url(#bg)"/>

  <g clip-path="url(#win)">
    <rect x="1" y="45" width="898" height="274" fill="url(#grid)"/>

    <!-- glowing orbs that drift slowly -->
    <circle cx="180" cy="190" r="130" fill="#58a6ff" fill-opacity="0.16" filter="url(#blur)">
      <animate attributeName="cx" values="180;300;180" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="210" r="140" fill="#bc8cff" fill-opacity="0.16" filter="url(#blur)">
      <animate attributeName="cx" values="730;600;730" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- drifting code glyphs -->
    <text class="g" x="655" y="300" style="animation-duration:11s;animation-delay:-2s">{ }</text>
    <text class="g" x="700" y="300" style="animation-duration:14s;animation-delay:-9s">&lt;/&gt;</text>
    <text class="g" x="765" y="300" style="animation-duration:10s;animation-delay:-5s">;</text>
    <text class="g" x="825" y="300" style="animation-duration:13s;animation-delay:-1s">=&gt;</text>
    <text class="g" x="865" y="300" style="animation-duration:12s;animation-delay:-7s">01</text>
    <text class="g" x="735" y="300" style="animation-duration:15s;animation-delay:-11s">()</text>
    <text class="g" x="845" y="300" style="animation-duration:9s;animation-delay:-4s">[]</text>
    <text class="g" x="785" y="300" style="animation-duration:16s;animation-delay:-13s">//</text>
    <text class="g" x="680" y="300" style="animation-duration:10s;animation-delay:-8s">&amp;&amp;</text>
    <text class="g" x="805" y="300" style="animation-duration:12s;animation-delay:-6s">::</text>

    <!-- a soft sheen sweeping across the window -->
    <rect x="-200" y="0" width="120" height="320" fill="url(#sheen)" transform="skewX(-20)">
      <animate attributeName="x" values="-200;1100" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- chrome -->
  <rect x="1" y="1" width="898" height="318" rx="14" fill="none" stroke="#30363d" stroke-width="2"/>
  <line x1="1" y1="44" x2="899" y2="44" stroke="#30363d" stroke-width="1"/>
  <circle cx="28" cy="23" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="23" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="23" r="6" fill="#27c93f"/>
  <text x="450" y="28" text-anchor="middle" class="title">thet@london: ~</text>

  <!-- content -->
  <g clip-path="url(#ct1)">
    <text x="40" y="96"><tspan class="prompt">$</tspan><tspan class="cmd" dx="9">whoami</tspan></text>
  </g>

  <g clip-path="url(#ct2)">
    <text x="40" y="156" class="name">Thet Naung Soe</text>
  </g>

  <g>
    <text x="40" y="196" class="role r1">&gt; I build backend systems.</text>
    <text x="40" y="196" class="role r2" opacity="0">&gt; Currently learning cloud and DevOps.</text>
    <text x="40" y="196" class="role r3" opacity="0">&gt; Breaking things on purpose, then fixing them.</text>
  </g>

  <text x="40" y="236" class="tags">
    London  ·  TypeScript, Python, Go  ·  PostgreSQL
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
      values="0;1;1" keyTimes="0;0.21;1"/>
  </text>

  <text x="40" y="288"><tspan class="prompt">$</tspan></text>
  <rect class="cursor" x="58" y="274" width="10" height="18"/>
</svg>
